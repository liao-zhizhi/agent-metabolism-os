[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-metabolism-os"
version = "1.0.10"
description = "Metabolic regulation for agent harnesses: an energy account, a dual-beat scheduler, compartmental isolation, and a penalty ledger that takes capability away when trust is broken."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Zhizhi Liao" }]

keywords = ["agents", "scheduler", "energy", "metabolism", "isolation", "risk", "audit"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
]

# No dependencies, by design: the claim is "standard library only", and a
# dependency list is the only honest place to make that claim checkable.
dependencies = []

[project.scripts]
agent-metabolism-demo = "demo:main"

[tool.setuptools]
# The demo stays outside the package on purpose: it is a read-only walkthrough,
# not importable machinery.
packages = ["agent_metabolism"]
py-modules = ["demo"]
