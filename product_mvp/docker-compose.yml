# CEL console -- one command.
#
#   cd product_mvp
#   docker compose up --build
#   open http://localhost:8000
#
# The build context is this directory. The image fetches the core library from
# the pinned release tag instead of copying a parent directory, because a
# Hugging Face Space can only build from the root of its own repo -- and one
# Dockerfile that works in both places is better than two that drift.

services:
  cel:
    build:
      context: .
      dockerfile: Dockerfile
    image: cel-console:0.3.0
    container_name: cel-console
    ports:
      # Host 8000 -> container 7860: the image's default port is the one a
      # Hugging Face Space expects, so the same image is what gets deployed.
      - "8000:7860"
    environment:
      # Consecutive FAILs before an agent is quarantined (core minimum is 2).
      CEL_FAIL_LIMIT: "3"
      # Append the hash chain to a volume, so a restart is still auditable.
      CEL_LEDGER_LOG: "/data/ledger.jsonl"
      # Shared write key. Passed through from your shell, never written here:
      #   CEL_API_KEY=$(python -c 'import secrets;print(secrets.token_urlsafe(32))') docker compose up
      # Unset means the gate is OFF -- the dashboard will say so in red.
      CEL_API_KEY: "${CEL_API_KEY:-}"
      # Writes allowed per client IP per sliding window; the 6th is a 429.
      # 0 disables it. Reads are never limited.
      CEL_RATE_LIMIT: "${CEL_RATE_LIMIT:-5}"
      CEL_RATE_WINDOW: "${CEL_RATE_WINDOW:-60}"
    volumes:
      - cel-ledger:/data
    restart: unless-stopped

volumes:
  cel-ledger: {}
